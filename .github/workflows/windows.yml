name: Windows application

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      legacy_browser:
        description: Build and test the historical browser-assisted probe bundle
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
      - name: Test embedded UI behavior without a browser
        run: node --test web/app.test.cjs web/theme.test.cjs
      - name: Test Windows PowerShell launcher without Twitch
        shell: powershell
        run: .\scripts\Test-VeylurkLauncher.ps1
      - name: Test offline Windows operations without real startup tasks
        shell: powershell
        run: .\scripts\Test-VeylurkOperations.ps1
      - name: Test bounded local measurement without a collector
        shell: powershell
        run: .\scripts\Test-VeylurkMeasurement.ps1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked -- --skip collector::buffer_tests::fifty_room_collector_recovers_twice_from_thirteen_second_sqlite_stalls
      - name: Verify fixed-time buffered storage recovery in isolation
        run: cargo test --locked --lib collector::buffer_tests::fifty_room_collector_recovers_twice_from_thirteen_second_sqlite_stalls -- --exact --nocapture --test-threads=1
      - name: Exercise synthetic 10, 25 and 50 channel history workloads
        run: cargo test --locked scale_workload -- --ignored --nocapture --test-threads=1
      - name: Build release application and probes
        run: cargo build --release --locked
      - name: Smoke-check application help without Twitch
        shell: pwsh
        run: |
          .\target\release\veylurk.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Application help check failed' }
      - name: Verify offline performance harness with a small isolated workload
        shell: pwsh
        run: |
          $benchDirectory = Join-Path $env:RUNNER_TEMP ('veylurk-bench-smoke-' + [guid]::NewGuid().ToString('N'))
          .\target\release\veylurk-perf-bench.exe --output-dir $benchDirectory --channels 2 --events-per-channel 200 --query-repetitions 1 --max-seconds 120
          if ($LASTEXITCODE -ne 0) { throw 'Offline performance harness failed' }
          $benchReport = Get-Content -LiteralPath (Join-Path $benchDirectory 'report.json') -Raw | ConvertFrom-Json
          if (-not $benchReport.success -or $benchReport.provenance.network_used -or $benchReport.correctness.observed.observations -ne 400 -or -not $benchReport.files.settings_unchanged_and_full_durability) { throw 'Offline performance report contract was invalid' }
      - name: Verify packaged application startup and graceful exit without Twitch
        shell: pwsh
        run: |
          Remove-Item Env:\VEYLURK_TWITCH_CLIENT_ID -ErrorAction SilentlyContinue
          Remove-Item Env:\VEYLURK_TWITCH_CLIENT_SECRET -ErrorAction SilentlyContinue
          $smokeDirectory = Join-Path $env:RUNNER_TEMP ('veylurk-smoke-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $smokeDirectory -ErrorAction Stop | Out-Null
          $portReservation = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $portReservation.Start()
          $smokePort = $portReservation.LocalEndpoint.Port
          $portReservation.Stop()
          $process = Start-Process -FilePath (Join-Path $PWD 'target/release/veylurk.exe') -ArgumentList @('--database', 'smoke.sqlite3', '--port', $smokePort, '--run-for-seconds', '10') -WorkingDirectory $smokeDirectory -WindowStyle Hidden -PassThru -RedirectStandardOutput (Join-Path $smokeDirectory 'stdout.log') -RedirectStandardError (Join-Path $smokeDirectory 'stderr.log')
          try {
            $baseUrl = "http://127.0.0.1:$smokePort"
            $ready = $null
            $deadline = [DateTime]::UtcNow.AddSeconds(8)
            while ([DateTime]::UtcNow -lt $deadline -and -not $process.HasExited) {
              try { $ready = Invoke-RestMethod -Uri "$baseUrl/api/status" -TimeoutSec 2 } catch { $ready = $null }
              if ($ready -and $ready.state -eq 'idle') { break }
              Start-Sleep -Milliseconds 100
            }
            if (-not $ready -or $ready.state -ne 'idle' -or $ready.enabled_channels -ne 0 -or $ready.session_count -ne 0 -or $ready.observation_count -ne 0 -or $ready.storage_health -ne 'available') { throw 'Empty application startup status was invalid' }
            $metadata = Invoke-RestMethod -Uri "$baseUrl/api/metadata/status" -TimeoutSec 2
            if ($metadata.configured -or $metadata.channels.Count -ne 0) { throw 'Offline smoke unexpectedly enabled metadata' }
            $timeline = Invoke-RestMethod -Uri "$baseUrl/api/timeline?account=fixture_account" -TimeoutSec 2
            if ($timeline.account -ne 'fixture_account' -or $timeline.intervals.Count -ne 0 -or $timeline.has_more -or $null -ne $timeline.confidence -or $timeline.confidence_status -ne 'not_calibrated' -or $timeline.effective_range.from -ge $timeline.effective_range.to) { throw 'Packaged empty account timeline contract was invalid' }
            $page = Invoke-WebRequest -Uri "$baseUrl/" -TimeoutSec 2
            if ($page.StatusCode -ne 200 -or -not $page.Content.Contains('Veylurk') -or -not $page.Content.Contains('timeline-panel') -or -not $page.Content.Contains('broadcast-timeline-panel')) { throw 'Embedded interface was unavailable' }
            foreach ($asset in @('app.js', 'theme.js', 'style.css')) {
              $response = Invoke-WebRequest -Uri "$baseUrl/$asset" -TimeoutSec 2
              if ($response.StatusCode -ne 200 -or $response.RawContentLength -le 0) { throw 'Embedded asset was unavailable' }
            }
            if (-not $process.WaitForExit(20000)) { throw 'Timed graceful shutdown exceeded its watchdog' }
            if ($process.ExitCode -ne 0) { throw 'Timed application exit was unsuccessful' }
            $database = Get-Item -LiteralPath (Join-Path $smokeDirectory 'smoke.sqlite3') -ErrorAction Stop
            if ($database.Length -le 0) { throw 'Application database was not created' }
          } finally {
            if (-not $process.HasExited) { $process.Kill(); $process.WaitForExit() }
            $process.Dispose()
          }
      - name: Smoke-check IRC probe help without Twitch
        shell: pwsh
        run: |
          .\target\release\veylurk-irc-probe.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'IRC probe help check failed' }
      - name: Package standalone application and documentation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path app-package -ErrorAction Stop | Out-Null
          Copy-Item -LiteralPath target/release/veylurk.exe, README.md, LICENSE -Destination app-package -ErrorAction Stop
          Get-ChildItem -LiteralPath scripts -Filter '*Veylurk*.ps1' -File | Copy-Item -Destination app-package -ErrorAction Stop
          Copy-Item -LiteralPath scripts/Setup-Twitch.ps1 -Destination app-package -ErrorAction Stop
          New-Item -ItemType Directory -Path app-package/docs -ErrorAction Stop | Out-Null
          Copy-Item -LiteralPath docs/windows-operation.md, docs/performance.md, docs/measurement.md, docs/diagnostics.md, docs/timeline.md, docs/remaining-work.md -Destination app-package/docs -ErrorAction Stop
      - name: Verify packaged background shutdown and offline backup with actual SQLite
        shell: powershell
        run: |
          Remove-Item Env:\VEYLURK_TWITCH_CLIENT_ID -ErrorAction SilentlyContinue
          Remove-Item Env:\VEYLURK_TWITCH_CLIENT_SECRET -ErrorAction SilentlyContinue
          $maintenancePackage = Join-Path $env:RUNNER_TEMP ('veylurk operations ' + [guid]::NewGuid().ToString('N'))
          Copy-Item -LiteralPath app-package -Destination $maintenancePackage -Recurse -ErrorAction Stop
          . (Join-Path $maintenancePackage 'Veylurk-Operations.ps1')
          $reservation = New-Object Net.Sockets.TcpListener([Net.IPAddress]::Loopback, 0)
          $reservation.Start()
          $maintenancePort = $reservation.LocalEndpoint.Port
          $reservation.Stop()
          $arguments = '-NoProfile -NonInteractive -WindowStyle Hidden -File ' + (ConvertTo-VeylurkArgument (Join-Path $maintenancePackage 'Start-VeylurkBackground.ps1')) + ' -Port ' + $maintenancePort
          $supervisor = Start-Process -FilePath (Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe') -ArgumentList $arguments -WindowStyle Hidden -PassThru
          try {
            $runtime = $null
            $deadline = [DateTime]::UtcNow.AddSeconds(20)
            while ([DateTime]::UtcNow -lt $deadline -and -not $supervisor.HasExited) {
              try { $runtime = Get-VeylurkRuntime $maintenancePort } catch { $runtime = $null }
              if ($runtime) { break }
              Start-Sleep -Milliseconds 100
            }
            if (-not $runtime) { throw 'Packaged background startup did not become ready.' }
            $null = Assert-VeylurkRuntime $maintenancePackage $maintenancePort $runtime
            # Readiness alone must not hide an immediate signal-registration exit.
            foreach ($check in 1..3) {
              Start-Sleep -Seconds 2
              $stillRunning = Get-VeylurkRuntime $maintenancePort
              if ($supervisor.HasExited -or $stillRunning.instance_id -cne $runtime.instance_id) { throw 'Hidden packaged startup did not remain live.' }
            }
            . (Join-Path $maintenancePackage 'Measure-Veylurk.ps1')
            $measurementDirectory = Join-Path $env:RUNNER_TEMP ('veylurk-measurement-' + [guid]::NewGuid().ToString('N'))
            $measurement = Invoke-VeylurkMeasurement -PackageDirectory $maintenancePackage -Port $maintenancePort -DurationSeconds 60 -IntervalSeconds 2 -OutputDirectory $measurementDirectory -MaxSamples 3
            if ($measurement.samples -ne 3 -or $measurement.sample_outcomes.ok -ne 3) { throw 'Packaged local measurement did not retain three valid samples.' }
            $backupDirectory = Join-Path $env:RUNNER_TEMP ('veylurk-backup-' + [guid]::NewGuid().ToString('N'))
            $rejected = $false
            try { New-VeylurkOfflineBackup $maintenancePackage $backupDirectory } catch { $rejected = $true }
            if (-not $rejected -or (Test-Path -LiteralPath $backupDirectory)) { throw 'Backup did not refuse an active Rust database lock.' }
            Stop-VeylurkGracefully $maintenancePackage $maintenancePort 60
            if (-not $supervisor.WaitForExit(10000) -or $supervisor.ExitCode -ne 0) { throw 'Background supervisor did not exit successfully after graceful shutdown.' }
            New-VeylurkOfflineBackup $maintenancePackage $backupDirectory
            $null = Test-VeylurkBackup $backupDirectory
            $restoredData = Join-Path $env:RUNNER_TEMP ('veylurk-restored-' + [guid]::NewGuid().ToString('N'))
            Restore-VeylurkOfflineBackup $backupDirectory $restoredData
            $restoredHash = (Get-FileHash -LiteralPath (Join-Path $restoredData 'observations.sqlite3')).Hash
            $originalHash = (Get-FileHash -LiteralPath (Join-Path $maintenancePackage 'data\observations.sqlite3')).Hash
            if ($restoredHash -ne $originalHash) { throw 'Restored SQLite bytes differ.' }
          } finally {
            if (-not $supervisor.HasExited) {
              try { Stop-VeylurkGracefully $maintenancePackage $maintenancePort 60 } catch { Write-Warning 'Graceful CI cleanup was unavailable; no process was killed.' }
            }
            $supervisor.Dispose()
          }
      - name: Publish standalone Windows application artifact
        uses: actions/upload-artifact@v4
        with:
          name: veylurk-windows-x64
          path: app-package/
          if-no-files-found: error
      - name: Upload Windows IRC probe
        uses: actions/upload-artifact@v4
        with:
          name: veylurk-irc-probe-windows-x64
          path: target/release/veylurk-irc-probe.exe
          if-no-files-found: error
      - name: Upload offline Windows performance harness
        uses: actions/upload-artifact@v4
        with:
          name: veylurk-perf-bench-windows-x64
          path: target/release/veylurk-perf-bench.exe
          if-no-files-found: error
      - name: Upload Windows prototype
        uses: actions/upload-artifact@v4
        with:
          name: veylurk-probe-windows-x64
          path: target/release/veylurk-probe.exe
          if-no-files-found: error
      - name: Upload resolved lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veylurk-resolved-lockfile
          path: Cargo.lock
          if-no-files-found: error

  legacy-browser-bundle:
    if: github.event_name == 'workflow_dispatch' && inputs.legacy_browser
    needs: test-and-build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned browser helper dependencies
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = '1'
          npm ci --prefix browser-helper --omit=dev
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
      - name: Install matched Chromium for bundle
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $PWD 'browser-staging'
          node browser-helper/node_modules/playwright/cli.js install chromium --no-shell
          if ($LASTEXITCODE -ne 0) { throw 'Chromium installation failed' }
      - name: Build historical browser probe
        run: cargo build --release --locked --bin veylurk-browser-probe
      - name: Package historical browser probe
        shell: pwsh
        run: |
          .\scripts\package-windows.ps1 -BrowserDirectory (Join-Path $PWD 'browser-staging') -OutputDirectory (Join-Path $PWD 'stage3-bundle')
      - name: Smoke-check historical bundle without Twitch
        shell: pwsh
        run: |
          .\stage3-bundle\veylurk-browser-probe.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Packaged probe help check failed' }
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $PWD 'stage3-bundle\browsers'
          .\stage3-bundle\node.exe .\stage3-bundle\browser-helper\test-helper.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Packaged offline helper fixture failed' }
          .\stage3-bundle\node.exe --test .\stage3-bundle\browser-helper\test-native-response.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Packaged native response classifier tests failed' }
      - name: Upload historical browser-assisted prototype
        uses: actions/upload-artifact@v4
        with:
          name: veylurk-browser-probe-windows-x64
          path: stage3-bundle/
          if-no-files-found: error
          include-hidden-files: true
