[package]
name = "community-source"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false

[[example]]
name = "community-worker-fixture"
path = "tests/worker_fixture.rs"
test = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
