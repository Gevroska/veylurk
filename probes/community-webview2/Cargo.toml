[package]
name = "community-webview2-proof"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false

# Deliberately independent of the production application.
[workspace]

[[bin]]
name = "veylurk-community-webview2-proof"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
